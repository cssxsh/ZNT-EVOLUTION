<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AssetOverride 编辑器</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="app">
    <header class="topbar">
        <div class="brand">
            <span class="logo">◆</span>
            <h1>AssetOverride 编辑器</h1>
            <span class="sub">Type / Pattern / Handles</span>
        </div>
        <div class="actions">
            <button id="btnAdd" class="btn primary">＋ 新建覆盖项</button>
            <button id="btnImport" class="btn">导入</button>
            <button id="btnExport" class="btn">导出</button>
            <button id="btnClear" class="btn ghost danger">清空</button>
        </div>
    </header>

    <div class="workspace">
        <main class="editor" id="editor">
            <div class="list" id="list"></div>
        </main>

        <aside class="preview">
            <div class="preview-head">
                <span class="title">JSON 预览</span>
                <div class="right">
                    <span id="stats" class="stats"></span>
                    <button id="btnCopy" class="btn small">复制</button>
                </div>
            </div>
            <pre id="jsonOut" class="json mono"></pre>
            <div class="preview-foot">Pattern 作为 .NET 正则表达式；Handles 值按类型定义校验</div>
        </aside>
    </div>
</div>

<datalist id="typeOptions"></datalist>

<div id="modal" class="modal hidden">
    <div class="modal-box">
        <div class="modal-head">
            <h2 id="modalTitle"></h2>
            <button id="modalClose" class="icon-btn">✕</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-foot" id="modalFoot"></div>
    </div>
</div>

<script src="./schema.js"></script>
<script src="./app.js"></script>
</body>
</html>
